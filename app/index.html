<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>get swapd</title>
  <meta name="description" content="Download swapd — the photos you'd never post." />
  <meta name="theme-color" content="#F2E6CE" />
  <meta name="apple-itunes-app" content="app-id=6762082136" />
  <link rel="stylesheet" href="/assets/swapd.css" />
  <style>
    main.center-stage { flex-direction: column; text-align: center; }
    .tagline {
      font-family: var(--hand);
      font-size: 22px;
      color: var(--ink-muted);
      margin: 8px 0 36px;
    }
    .status {
      font-size: 15px;
      color: var(--ink-muted);
      margin-bottom: 24px;
      min-height: 24px;
      max-width: 320px;
    }
    .actions { width: 100%; max-width: 320px; }
    .btn-ghost {
      background: transparent;
      color: var(--ink-muted);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
    }
    .btn-ghost:hover { color: var(--ink); }
    .home-link {
      position: fixed;
      top: 20px;
      left: 20px;
      font-family: var(--hand);
      font-size: 20px;
      color: var(--accent);
      text-decoration: none;
    }
    .home-link:hover { color: var(--accent-deep); }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<a href="/" class="home-link">← getswapd.com</a>

<main class="center-stage">
  <a class="swapd-wordmark large" href="/" aria-label="swapd">swapd<svg viewBox="0 0 120 10" aria-hidden="true"><path d="M2 5 Q 18 1, 34 5 T 66 5 T 98 5 T 118 3" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" /></svg></a>
  <div class="tagline">the photos you'd never post.</div>

  <div class="status" id="status">
    <span class="spinner"></span>taking you to the right place&hellip;
  </div>

  <div class="actions" id="buttons" style="display:none;"></div>
</main>

<script>
  var APP_STORE_URL  = 'https://apps.apple.com/gb/app/swapd-fun-photo-swaps/id6762082136';
  // Android is in closed testing — public Play listing not yet live.
  // Send Android visitors to the beta-signup callout on /support.
  var ANDROID_BETA_URL = '/support#android-beta';

  var ua = navigator.userAgent || navigator.vendor || window.opera || '';
  var isIOS     = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /android/i.test(ua);

  var statusEl  = document.getElementById('status');
  var buttonsEl = document.getElementById('buttons');

  function showButtons(html) {
    statusEl.style.display = 'none';
    buttonsEl.style.display = 'flex';
    buttonsEl.innerHTML = html;
  }

  if (isIOS) {
    statusEl.innerHTML = '<span class="spinner"></span>opening the App Store&hellip;';
    setTimeout(function () { window.location.replace(APP_STORE_URL); }, 400);
    setTimeout(function () {
      showButtons(
        '<a href="' + APP_STORE_URL + '" class="btn btn-primary">Download on the App Store</a>' +
        '<a href="/" class="btn btn-ghost">back to getswapd.com</a>'
      );
    }, 2500);
  } else if (isAndroid) {
    statusEl.innerHTML = 'swapd on Android is in closed testing.';
    showButtons(
      '<a href="' + ANDROID_BETA_URL + '" class="btn btn-primary">Join the Android beta</a>' +
      '<a href="/" class="btn btn-ghost">back to getswapd.com</a>'
    );
  } else {
    statusEl.innerHTML = 'open this on your phone to install, or pick a store:';
    showButtons(
      '<a href="' + APP_STORE_URL + '" class="btn btn-primary">Download on the App Store</a>' +
      '<a href="' + ANDROID_BETA_URL + '" class="btn btn-secondary">Join the Android beta</a>' +
      '<a href="/" class="btn btn-ghost">open getswapd.com instead</a>'
    );
  }
</script>

</body>
</html>
