<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>You&rsquo;re invited — swapd</title>
  <link rel="stylesheet" href="/assets/swapd.css" />
  <style>
    body { padding: 0; }
    main.center-stage { padding: 32px 18px; }
    .invalid { text-align: center; }
    .invalid h1 { margin-bottom: 8px; }
  </style>
</head>
<body>
  <main class="center-stage">
    <div class="card" id="card">
      <!-- Populated by script below. -->
    </div>
  </main>

  <script>
    (function () {
      // App Store URL — swapd is live at this listing.
      var APP_STORE_URL = 'https://apps.apple.com/gb/app/swapd-fun-photo-swaps/id6762082136';
      // Android is in closed testing; the public listing lands here when it ships.
      // Until then, /support tells visitors how to join the beta.
      var PLAY_STORE_URL = 'https://getswapd.com/support#android-beta';

      function parseCode() {
        var params = new URLSearchParams(window.location.search);
        var raw = (params.get('code') || '').trim().toUpperCase();
        if (!/^[A-Z0-9]{4,16}$/.test(raw)) return null;
        return raw;
      }

      function detectPlatform() {
        var ua = navigator.userAgent || '';
        if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
        if (/Android/i.test(ua)) return 'android';
        return 'other';
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      function wordmark() {
        return (
          '<a class="swapd-wordmark" href="/" aria-label="swapd">swapd' +
          '<svg viewBox="0 0 120 10" aria-hidden="true">' +
            '<path d="M2 5 Q 18 1, 34 5 T 66 5 T 98 5 T 118 3" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" />' +
          '</svg></a>'
        );
      }

      var card = document.getElementById('card');
      var code = parseCode();

      if (!code) {
        card.className = 'card invalid';
        card.innerHTML =
          wordmark() +
          '<h1>Invite link not recognised.</h1>' +
          '<p class="lead">Ask whoever sent it for the code and paste it into the app.</p>';
        return;
      }

      var platform = detectPlatform();
      var iosLabel = 'Download on the App Store';
      var androidLabel = 'Join the Android beta';
      var storeLabel = platform === 'android' ? androidLabel : iosLabel;
      var storeUrl = platform === 'android' ? PLAY_STORE_URL : APP_STORE_URL;

      card.innerHTML =
        wordmark() +
        '<h1>You&rsquo;re invited.</h1>' +
        '<p class="lead">swapd is a tiny, private space for two. Someone just made one with you in mind.</p>' +
        '<div class="code-box">' +
          '<p class="code-label">your invite code</p>' +
          '<p class="code">' + escapeHtml(code) + '</p>' +
        '</div>' +
        '<div class="actions">' +
          '<button type="button" class="btn btn-primary" id="install-btn">' + storeLabel + '</button>' +
          '<button type="button" class="btn btn-secondary" id="open-btn">I already have swapd</button>' +
        '</div>' +
        '<p class="small">After installing, open swapd. The code will be in your clipboard ready to paste &mdash; or type it in if you prefer.</p>';

      var installBtn = document.getElementById('install-btn');
      var openBtn = document.getElementById('open-btn');

      installBtn.addEventListener('click', function () {
        var done = function () {
          installBtn.textContent = platform === 'android' ? 'Code copied — opening…' : 'Code copied — opening App Store…';
          window.setTimeout(function () { window.location.href = storeUrl; }, 350);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done, done);
        } else {
          done();
        }
      });

      openBtn.addEventListener('click', function () {
        window.location.href = 'swapd://join/' + code;
      });
    })();
  </script>
</body>
</html>
